services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/traefik.yml
#      - ./acme.json:/acme.json
    ports:
      - 80:80
      - 443:443
#      - 8080:8080
    networks:
      - web

  db:
    image: mariadb:latest
    container_name: pmbdb
    restart: unless-stopped
    volumes:
      - ./.data/db:/var/lib/mysql
      - ./php7/my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${CONTAINER_TIMEZONE}
    networks:
      - default

  php:
    build:
      context: php7
      args:
        PMB_VERSION: ${PMB_VERSION}
    container_name: pmbphp
    restart: unless-stopped
    volumes:
      - ../doc_num:/var/www/pmb/doc_num
      - ../docscdi:/var/www/pmb/docscdi
#      - ../docscdi_zen:/var/www/pmb/docscdi_zen
      - ../.img_cache:/var/www/pmb/img_cache
    environment:
      TZ: ${CONTAINER_TIMEZONE}
    networks:
      - web
      - default
    labels:
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_BASE_URL}`)"
      - "traefik.enable=true"
      - "traefik.docker.network=web"

networks:
  web:
    external: true
  default:
